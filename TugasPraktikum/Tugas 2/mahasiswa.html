<!DOCTYPE html>
<html lang="en">
<head>
    <title>Mahasiswa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .Absensi {
            border: 1px solid #000;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .Absensi h2 {
            margin-top: 0;
            font-family: 'Times New Roman', Times, serif;
        }

        table {
            margin: 0 auto;
            border-collapse: collapse;
            font-size: 14px;
        }

        table, th, td {
            border: 1px solid #000;
        }

        th, td {
            padding: 4px 8px;
            text-align: center;
        }

        .Form {
            margin-top: 20px;
        }

        .Form h2 {
            font-family: 'Times New Roman', Times, serif;
            margin-bottom: 15px;
        }

        fieldset {
            border: 1px solid #777;
            margin-bottom: 15px;
            padding: 10px 15px 15px 15px;
        }

        legend {
            font-weight: bold;
            padding: 0 5px;
        }

        .form-group {
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
        }

        .form-group label.title {
            width: 150px;
            display: inline-block;
        }

        .separator {
            margin-right: 10px;
        }

        input[type="text"], select, textarea {
            font-family: inherit;
            font-size: 14px;
        }

        .checkbox-group, .radio-group {
            display: inline-block;
        }

        .checkbox-row {
            margin-bottom: 5px;
        }

        .checkbox-row label, .radio-group label {
            margin-right: 12px;
        }

        .button-group {
            margin-top: 10px;
        }

        .button-group button {
            padding: 2px 8px;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="Absensi">
        <h2>Absensi Mahasiswa Teknik Informatika</h2>
        <table>
            <th>
                <tr>
                    <th rowspan="2">NO</th>
                    <th rowspan="2">NPM</th>
                    <th rowspan="2">NAMA</th>
                    <th colspan="7">PERTEMUAN</th>
                </tr>
                <tr>
                    <th>1</th>
                    <th>2</th>
                    <th>3</th>
                    <th>4</th>
                    <th>5</th>
                    <th>6</th>
                    <th>7</th>
                </tr>
                <tr>
                    <th colspan="3"></th>
                    <th>9-Feb</th>
                    <th>16-Feb</th>
                    <th>23-Feb</th>
                    <th>2-Mar</th>
                    <th>9-Mar</th>
                    <th>16-Mar</th>
                    <th>23-Mar</th>
                </tr>
            </th>
            <tb>
                <tr>
                    <td>1</td>
                    <td>1234567890</td>
                    <td style="text-align: left;">Kairi Kumar</td>
                    <td>v</td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>0987654321</td>
                    <td style="text-align: left;">Kim Ji Won</td>
                    <td>v</td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>1357924680</td>
                    <td style="text-align: left;">Mr Beast</td>
                    <td>v</td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </tb>
        </table>
    </div>

<div class="Form">
        <h2>Form Mahasiswa</h2>
        <form>
            <fieldset>
                <legend>Data Mahasiswa</legend>
                
                <div class="form-group">
                    <label class="title">Nama</label>
                    <span class="separator">:</span>
                    <input type="text" name="nama">
                </div>
                
                <div class="form-group">
                    <label class="title">NPM</label>
                    <span class="separator">:</span>
                    <input type="text" name="npm">
                </div>

                <div class="form-group">
                    <label class="title">Kelas</label>
                    <span class="separator">:</span>
                    <select name="kelas">
                        <option value="">-</option>
                        <option value="IF-A">IF-A</option>
                        <option value="IF-B">IF-B</option>
                        <option value="IF-B">IF-c</option>
                        <option value="IF-B">NR</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="title">Jenis Kelamin</label>
                    <span class="separator">:</span>
                    <div class="radio-group">
                        <label><input type="radio" name="jk" value="Pria"> Pria</label>
                        <label><input type="radio" name="jk" value="Wanita"> Wanita</label>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Tempat Tinggal Mahasiswa</legend>
                
                <div class="form-group">
                    <label class="title">Alamat</label>
                    <span class="separator">:</span>
                    <textarea name="alamat" rows="4" cols="25"></textarea>
                </div>

                <div class="form-group">
                    <label class="title">Kecamatan</label>
                    <span class="separator">:</span>
                    <input type="text" name="kecamatan">
                </div>

                <div class="form-group">
                    <label class="title">Kabupaten/Kotamadya</label>
                    <span class="separator">:</span>
                    <input type="text" name="kabupaten">
                </div>

                <div class="form-group">
                    <label class="title">Provinsi</label>
                    <span class="separator">:</span>
                    <input type="text" name="provinsi">
                </div>

                <div class="form-group">
                    <label class="title">Kode Pos</label>
                    <span class="separator">:</span>
                    <input type="text" name="kode_pos">
                </div>
            </fieldset>

            <fieldset>
                <legend>Lain-lainnya</legend>
                
                <div class="form-group">
                    <label class="title">Bahasa Pemrograman</label>
                    <span class="separator">:</span>
                    <div class="checkbox-group">
                        <div class="checkbox-row">
                            <label><input type="checkbox" name="bahasa[]" value="C/C++"> C / C++</label>
                            <label><input type="checkbox" name="bahasa[]" value="Go Lang"> Go Lang</label>
                            <label><input type="checkbox" name="bahasa[]" value="Python"> Python</label>
                            <label><input type="checkbox" name="bahasa[]" value="Lainnya"> Lainnya</label>
                        </div>
                        <div class="checkbox-row">
                            <label><input type="checkbox" name="bahasa[]" value="PHP"> PHP</label>
                            <label><input type="checkbox" name="bahasa[]" value="Javascript"> Javascript</label>
                            <label><input type="checkbox" name="bahasa[]" value="Ruby"> Ruby</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="title">Kegiatan</label>
                    <span class="separator">:</span>
                    <div class="checkbox-group">
                        <div class="checkbox-row">
                            <label><input type="checkbox" name="kegiatan[]" value="Organisasi Kemahasiswaan"> Organisasi Kemahasiswaan</label>
                            <label><input type="checkbox" name="kegiatan[]" value="Bidang Olahraga"> Bidang Olahraga</label>
                            <label><input type="checkbox" name="kegiatan[]" value="Lainnya"> Lainnya</label>
                        </div>
                        <div class="checkbox-row">
                            <label><input type="checkbox" name="kegiatan[]" value="Organisasi di Luar Kampus"> Organisasi di Luar Kampus</label>
                            <label><input type="checkbox" name="kegiatan[]" value="Bidang Seni"> Bidang Seni</label>
                        </div>
                    </div>
                </div>
            </fieldset>

            <div class="button-group">
                <button type="reset">Reset</button>
                <button type="submit">Submit</button>
            </div>
        </form>
    </div>

    </div>
</body>
</html>
