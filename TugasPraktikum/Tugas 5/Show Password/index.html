<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hide and Show Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <input type="password" id="cek" class="input-pass" value="123456789">
  <input type="text" id="cek2" class="input-pass" value="123456789">

  <div class="show-box">
    <input type="checkbox" id="chkShow">
    <label for="chkShow">Show</label>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js.js"></script>
</body>
</html>
